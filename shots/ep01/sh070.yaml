notes: |
  大场面。葫芦还是葫芦形态，没变成娃，只是睁了眼（flash）。
  绿葫芦喷火、青葫芦喷水 —— 葫芦没有人头，喷射起点和射程靠 spray.from / scale 自己指。
  小妖 3、4 号被打跑直接往右；1、2 号折回去把爷爷放倒扛走，全程贴着爷爷走。
  爷爷不挣扎：匀速平移，没有缓冲。
