id: sh020
episode: ep01
title: 山裂开，两个妖怪出来了
duration: 5.0

camera:
  lens: 28
  keys:
    - {t: 0.0, loc: [0.0, -10.0, 3.2], rot: [80.0, 0.0, 0.0]}
    - {t: 5.0, loc: [0.0, -10.0, 3.2], rot: [80.0, 0.0, 0.0]}

subjects:
  - name: shan
    proxy: {kind: box, size: [6.0, 3.0, 4.0], color: [0.40, 0.38, 0.36]}
    keys:
      - {t: 0.0, loc: [0.0, 2.0, 0.0]}
      - {t: 2.0, loc: [0.0, 2.0, 0.0]}
      # 山裂开的方式是整块往下沉。不做碎块模拟。
      # 沉到 -3.2：山高 4 米，只沉 1.8 米的话还剩 2.2 米立在那儿，
      # 而它横跨 y 0.5~3.5，摄影机在 y=-10，后面的妖怪一个都看不见。
      - {t: 5.0, loc: [0.0, 2.0, -3.2]}

  - name: shejing
    proxy:
      kind: humanoid
      height: 1.72
      color: [0.70, 0.74, 0.58]      # 惨白泛绿
      face:
        eyes: true
        pupil: slit                   # 竖瞳
        brows: true
        nose: true
        chin: pointed                 # 尖下巴。科长说尖才好看
        hair: hood                    # 蛇冠
        fangs: true                   # 两颗獠牙，一长一短
        hair_color: [0.17, 0.31, 0.21]
      lower: tail                     # 不要腿，要尾巴。科长要求
      lower_color: [0.26, 0.46, 0.30]  # 鳞的绿，不是肉色
      clothes: {robe: [0.23, 0.40, 0.27], sash: [0.11, 0.19, 0.13], length: short}
    keys:
      # 从山里升上来，落到地面 z=0（原来是 0.4，人形会浮在空中）
      - {t: 2.0, loc: [-1.2, 0.2, -2.0], rot: [0.0, 0.0, 0.0]}
      - {t: 5.0, loc: [-1.2, 0.0, 0.0], rot: [0.0, 0.0, 34.0]}

  - name: xiezijing
    proxy:
      kind: humanoid
      height: 1.78
      color: [0.58, 0.31, 0.23]
      tail: scorpion                  # 从右胯起拱，翻过头顶，毒针朝前下方
      tail_color: [0.42, 0.20, 0.15]
      face: {eyes: true, brows: true, nose: true, fangs: true, hair: none}
      clothes: {robe: [0.46, 0.21, 0.17], sash: [0.20, 0.11, 0.09], length: short}
      shoes: {color: [0.18, 0.12, 0.10], sole: [0.55, 0.45, 0.38]}
    keys:
      - {t: 2.4, loc: [1.4, 0.5, -2.0]}
      - {t: 5.0, loc: [1.4, 0.3, 0.0]}

dialogue:
  - {t: 3.2, who: shejing, line: "出来了。", dur: 1.0}

notes: |
  原集这里有光效和烟。规格里没有体积雾，也不打算加 —— 见 docs/NIULAI_LOOK.md 第 7 条。
